name: CI

on: [push, pull_request]

jobs:
  format:
    name: Format check
    runs-on: "py313"
    steps:
      - name: Bootstrap JS action runtime
        run: |
          apt-get update
          apt-get install -y nodejs npm git

      - uses: actions/checkout@v4

      - name: Install PDM
        run: python -m pip install --break-system-packages pdm

      - name: Install lint dependencies
        run: pdm install -G lint

      - name: Check formatting
        run: pdm run fmt-check

  lint:
    name: Lint & type-check
    runs-on: "py313"
    needs: format
    steps:
      - name: Bootstrap JS action runtime
        run: |
          apt-get update
          apt-get install -y nodejs npm git

      - uses: actions/checkout@v4

      - name: Install PDM
        run: python -m pip install --break-system-packages pdm

      - name: Install dependencies
        run: pdm install -G lint

      - name: Lint
        run: pdm run lint

      - name: Type-check
        run: pdm run type-check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            runner: "py311"
          - python-version: "3.12"
            runner: "py312"
          - python-version: "3.13"
            runner: "py313"
          - python-version: "3.14"
            runner: "py314"
    steps:
      - name: Bootstrap JS action runtime
        run: |
          apt-get update
          apt-get install -y nodejs npm git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDM
        run: python -m pip install --break-system-packages pdm

      - name: Install dependencies
        run: pdm install -G pytest

      - name: Run tests
        run: pdm run pytest --cov=[[ module_name ]] --cov-report=term-missing tests/

      - name: Upload coverage report
        if: always()
        run: echo "Coverage reported above (non-blocking)"
